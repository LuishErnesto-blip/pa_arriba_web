{% load static %}
<!-- Tarjeta para la sección de Testimonios -->
<div class="accordion-card testimonios-card" data-section-id="testimonios" id="testimonios-card">
    <div class="accordion-header">
        <h2 class="text-3xl font-extrabold flex items-center text-pa-arriba-blue-dark">
            <i class="fas fa-quote-right text-4xl mr-3"></i>
            Lo Que Dicen Nuestros Emprendedores
        </h2>
        <span class="accordion-icon">+</span>
    </div>
    <div class="accordion-content rounded-b-xl">
        <section class="testimonios-section p-6">
            <div class="testimonios-grid grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="testimonio-item bg-gray-100 p-4 rounded-lg shadow-md">
                    <a class="yt-facade" href="https://www.youtube.com/shorts/FKOTP7zNC8U" target="_blank" rel="noopener">
                        <img src="https://i.ytimg.com/vi/FKOTP7zNC8U/hqdefault.jpg" alt="Testimonio Christhian, GyG Catering" loading="lazy" width="480" height="360">
                        <span class="yt-play-btn"><i class="fas fa-play"></i></span>
                    </a>
                    <p class="autor font-semibold text-gray-900 mt-3 text-center">Christhian — GyG Catering</p>
                </div>
                <div class="testimonio-item bg-gray-100 p-4 rounded-lg shadow-md">
                    <a class="yt-facade" href="https://www.youtube.com/shorts/YDIvuPtVjGw" target="_blank" rel="noopener">
                        <img src="https://i.ytimg.com/vi/YDIvuPtVjGw/hqdefault.jpg" alt="Testimonio Diana, Picantería Don Pato" loading="lazy" width="480" height="360">
                        <span class="yt-play-btn"><i class="fas fa-play"></i></span>
                    </a>
                    <p class="autor font-semibold text-gray-900 mt-3 text-center">Diana — Picantería Don Pato (El Coca)</p>
                </div>
                <div class="testimonio-item bg-gray-100 p-4 rounded-lg shadow-md">
                    <a class="yt-facade" href="https://www.youtube.com/shorts/yKQWpJ6W_pk" target="_blank" rel="noopener">
                        <img src="https://i.ytimg.com/vi/yKQWpJ6W_pk/hqdefault.jpg" alt="Testimonio Heidy, Gnomos Quito" loading="lazy" width="480" height="360">
                        <span class="yt-play-btn"><i class="fas fa-play"></i></span>
                    </a>
                    <p class="autor font-semibold text-gray-900 mt-3 text-center">Heidy — Gnomos Quito</p>
                </div>
            </div>
            <div class="flex justify-center mt-4">
                <span class="accordion-icon accordion-footer-collapse-btn cursor-pointer text-4xl leading-none">&minus;</span>
            </div>
        </section>
    </div>
</div>
