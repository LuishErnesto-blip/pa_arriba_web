{% load static %}
<nav class="site-nav flex justify-between items-center px-5 py-4 bg-gray-900 text-white relative z-50">
    <a href="{% url 'core:index' %}" class="site-nav-logo">
        <img src="{% static 'core/logo_pa_arriba.png' %}" width="44" height="44" alt="Pa'Arriba">
    </a>
    
    <!-- Botón Hamburguesa para Móvil -->
    <button id="menu-toggle" class="md:hidden text-white focus:outline-none p-2" aria-label="Abrir menú">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- Enlaces de navegación -->
    <div id="menu-links" class="hidden md:flex flex-col md:flex-row absolute md:relative top-full left-0 w-full md:w-auto bg-gray-900 md:bg-transparent shadow-lg md:shadow-none p-5 md:p-0 gap-4 items-center">
        <a href="{% url 'core:index' %}" class="hover:text-orange-500 transition-colors">Inicio</a>
        <a href="{% url 'core:asesorias_gastronomicas' %}" class="hover:text-orange-500 transition-colors">Asesoría</a>
        <a href="{% url 'core:curso_costos_landing' %}" class="hover:text-orange-500 transition-colors">Curso de Costos</a>
        <a href="{% url 'core:marketing_digital_landing' %}" class="hover:text-orange-500 transition-colors">Marketing Digital</a>
        <a href="{% url 'core:metodo_landing' %}" class="hover:text-orange-500 transition-colors">Método</a>
        <a href="{% url 'core:rentabilidad_landing' %}" class="hover:text-orange-500 transition-colors">Rentabilidad</a>
        <a href="{% url 'core:oxigeno_app_landing' %}" class="hover:text-orange-500 transition-colors">Oxígeno App</a>
        <a href="{% url 'core:sri_landing' %}" class="hover:text-orange-500 transition-colors">Facturación SRI</a>
        <a href="{% url 'blog:post_list' %}" class="hover:text-orange-500 transition-colors">Blog</a>
    </div>
</nav>

<script>
    document.getElementById('menu-toggle').addEventListener('click', function() {
        var menu = document.getElementById('menu-links');
        menu.classList.toggle('hidden');
        menu.classList.toggle('flex');
    });
</script>
